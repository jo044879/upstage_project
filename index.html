<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>전세 서류 점검 · Ctrl+AI</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><header><strong>Ctrl<span>+</span>AI</strong><small>중개사 워크스페이스</small></header><main><h1>전세 서류 위험성 평가</h1><p>다세대주택 한 호실의 계약 서류를 등록하고 위험 신호를 확인하세요.</p><div class="layout"><form><h2>계약 서류</h2><p>PDF 또는 사진 한 개를 끌어다 놓거나 선택하세요.</p><label>분석할 서류<input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.bmp,.tif,.tiff,.heic"></label><button id="submit" disabled>위험성 평가하기 →</button></form><section aria-live="polite"><div class="top"><h2>평가 결과</h2><button type="button" id="demo">예시 보기</button></div><div id="result"></div></section></div></main></body></html>
